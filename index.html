<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleksander Reid - Digital Business Card</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#65ddeb">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#65ddeb',
                        secondary: '#fcfc03',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: linear-gradient(135deg, #d8f7fc 0%, #fdfdcc 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 380px;
            height: 700px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .card-container.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #65ddeb, #4bc2cf);
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .btn-custom {
            transition: all 0.2s ease-in-out;
        }
        
        .btn-custom:active {
            transform: scale(0.95);
        }

        #custom-modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        
        #custom-modal.show {
            display: flex;
        }
    </style>
</head>

                            <span class="text-sm">Install App</span>
                        </button>
                    </div>

                    <button onclick="flipCard()" class="mt-6 w-full py-4 bg-gradient-to-r from-primary to-secondary text-gray-900 font-extrabold rounded-xl shadow-lg flex items-center justify-center gap-3 transition-transform hover:scale-[1.02]">
                        <i class="fa-solid fa-qrcode text-xl"></i>
                        Show QR Code
                    </button>
                </div>
            </div>

            <!-- Back of Card (QR Code) -->
            <div class="card-back">
                <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center w-full max-w-[300px]">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Scan to Save</h2>
                    <p class="text-gray-500 text-sm mb-6 text-center">Point your camera at this code to get my number directly.</p>
                    
                    <!-- QR Code with +1 format so iPhone dials correctly -->
                    <div class="p-2 border-4 border-secondary rounded-2xl mb-6 bg-white">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=tel:%2B19258121424&margin=10" alt="QR Code to Call 925-812-1424" class="w-48 h-48">
                    </div>
                    
                    <p class="font-bold text-lg text-gray-800 tracking-wider">925-812-1424</p>
                </div>
                
                <button onclick="flipCard()" class="mt-8 px-8 py-3 bg-gray-900 text-white font-bold rounded-full shadow-lg flex items-center justify-center gap-2 hover:bg-gray-800 transition-colors">
                    <i class="fa-solid fa-rotate-left"></i>
                    Back to Profile
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 transform transition-all text-center">
            <div id="modal-icon" class="text-4xl mb-4 text-primary">
                <i class="fa-solid fa-info-circle"></i>
            </div>
            <h3 id="modal-title" class="text-xl font-bold text-gray-900 mb-2">Message</h3>
            <p id="modal-content" class="text-gray-600 mb-6">Details go here.</p>
            <button onclick="closeModal()" class="w-full bg-primary text-gray-900 font-bold py-3 px-4 rounded-xl shadow-md hover:bg-[#52c8d6]">
                Got it
            </button>
        </div>
    </div>

    <script>
        function flipCard() {
            const card = document.getElementById('ecard');
            card.classList.toggle('is-flipped');
        }

        function showModal(title, message, iconClass) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerText = message;
            document.getElementById('modal-icon').innerHTML = `<i class="${iconClass}"></i>`;
            document.getElementById('custom-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('show');
        }

        async function shareProfile() {
            const shareData = {
                title: 'Aleksander Reid',
                text: 'Connect with Aleksander Reid! Call: 925-812-1424',
                url: window.location.href
            };

            // Use native share sheet if available (mobile + HTTPS)
            if (navigator.share && window.isSecureContext) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    // User cancelled — that's fine, do nothing
                    if (err.name !== 'AbortError') {
                        console.error('Share failed:', err);
                        copyToClipboard(shareData);
                    }
                }
            } else {
                // Desktop / unsupported / file:// — copy to clipboard instead
                copyToClipboard(shareData);
            }
        }

        function copyToClipboard(shareData) {
            const textToCopy = shareData.text + " " + shareData.url;

            // Modern clipboard API (HTTPS only)
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(function () {
                    showModal("Link Copied!", "Aleksander's contact info has been copied to your clipboard.", "fa-solid fa-check-circle text-green-500");
                }).catch(function () {
                    legacyCopy(textToCopy);
                });
            } else {
                legacyCopy(textToCopy);
            }
        }

        function legacyCopy(textToCopy) {
            const tempInput = document.createElement("input");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showModal("Link Copied!", "Aleksander's contact info has been copied to your clipboard.", "fa-solid fa-check-circle text-green-500");
        }

        function installApp() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            
            if (isIOS) {
                showModal("Install on iOS", "Tap the 'Share' button at the bottom of Safari and select 'Add to Home Screen' to install this card.", "fa-brands fa-apple text-gray-800");
            } else {
                showModal("Install on Android", "Tap the menu icon (3 dots) in your browser and select 'Add to Home screen' or 'Install App'.", "fa-brands fa-android text-green-500");
            }
        }
    </script>
</body>
</html>
